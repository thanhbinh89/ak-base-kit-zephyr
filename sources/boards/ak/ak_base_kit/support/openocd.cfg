# SWD debug/flash for the AK Embedded Base Kit v2.3 (STM32L151CBT6A).
#
# The kit brings SWD out on J14 (2.54 mm header, pin 3 = SWCLK, pin 4 = SWDIO)
# and on J15 (SH1.0 "SWD Program", pin 3 = SWCLK, pin 4 = SWDIO). Any ST-LINK
# style probe works; override with `west flash --openocd-search ...` if you use
# a different adapter.

source [find interface/stlink.cfg]

transport select dapdirect_swd

source [find target/stm32l1.cfg]

reset_config srst_only srst_nogate connect_assert_srst

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
