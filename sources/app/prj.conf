# AK Embedded Base Kit -- board bring-up application
# STM32L151CBT6A: 128 KiB flash, 32 KiB SRAM. Keep an eye on both.

CONFIG_MAIN_STACK_SIZE=2048
# cfb_framebuffer_init() allocates the 128x64 mono buffer (1 KiB) from the heap
CONFIG_HEAP_MEM_POOL_SIZE=2048

# --- logging / console ------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CBPRINTF_NANO=y

# --- drivers exercised by main.c -------------------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y

CONFIG_I2C=y
CONFIG_I2C_GPIO=y

CONFIG_SPI=y
CONFIG_FLASH=y
# SFDP_MINIMAL: page/erase geometry comes from jedec-id + size in the DTS,
# no runtime SFDP parsing (saves a few KiB on a 128 KiB part).
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
CONFIG_FLASH_JESD216_API=y
# W25Q80 erases in 4 KiB sectors; expose that instead of the 64 KiB default
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

CONFIG_PWM=y

CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# Ship one 10x16 font from src/font.c instead of Zephyr's three built-in sizes
# (13811 B, a quarter of the image). See src/font.c for how to regenerate it.
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n

CONFIG_RTC=y
